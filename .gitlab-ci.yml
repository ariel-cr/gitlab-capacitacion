# Pipeline del laboratorio.
#
# Las cuatro etapas son EXACTAMENTE las del Tema 8, diapositiva 23:
#   1. Unit Test          · verificar la lógica antes de gastar tiempo compilando
#   2. Análisis de código · calidad del código ya probado
#   3. Build del paquete  · recién aquí se construye la IMAGEN
#   4. Deploy al ambiente · sólo se despliega lo que superó las tres anteriores
#
# Y las ramas son las del Tema 10, diapositiva 20:
#   dev    → despliega en el servidor DEV    (automático)
#   test   → despliega en el servidor TEST   (automático)
#   master → despliega en PROD               (MANUAL, con botón)
#
# EL RECORRIDO COMPLETO DE UN CAMBIO
# ──────────────────────────────────
#   1. el alumno empuja a `dev`
#   2. el runner construye una IMAGEN de Docker
#   3. la sube al registro del taller
#   4. entra por SSH al servidor del ambiente
#   5. ese servidor BAJA la imagen del registro y levanta el contenedor
#
# El paso 5 es el que importa: el contenedor corre en el Docker DEL SERVIDOR,
# no en el del Mac. Cada ambiente despliega en su propia máquina.
#
# Variables que hay que crear en GitLab (Settings → CI/CD → Variables):
#   SSH_PRIVADA   tipo File, sin Protect   ← la imprime preparar-ambientes.sh

stages:
  - unit-test
  - analisis
  - build
  - deploy

variables:
  REGISTRO: "registro:5000"
  IMAGEN: "registro:5000/demo-fttg"
  VERSION: "1.0.$CI_PIPELINE_IID"

default:
  tags:
    - taller

# ─────────────────────────────────────────────────────────── 1 · UNIT TEST
pruebas-unitarias:
  stage: unit-test
  image: alpine:3.20
  script:
    - echo "Comprobando la plantilla de la aplicación"
    - cd app && sh test.sh index.template.html

# ─────────────────────────────────────────────────────────── 2 · ANÁLISIS
analisis-de-codigo:
  stage: analisis
  image: alpine:3.20
  script:
    - echo "Buscando valores de ejemplo sin rellenar"
    - |
      if grep -rn "CAMBIAR-ESTO" app/ ambientes/ 2>/dev/null; then
        echo "Hay marcadores de ejemplo sin rellenar"; exit 1
      fi
    - echo "Comprobando que la plantilla no trae el ambiente escrito a mano"
    - |
      if grep -qE '>(dev|test|prod)<' app/index.template.html; then
        echo "La plantilla lleva un ambiente fijo; debe ponerlo el pipeline"; exit 1
      fi
    - echo "Análisis superado"

# ─────────────────────────────────────────────────────────── 3 · BUILD
# Aquí se construye la imagen y se sube al registro. El runner usa el Docker
# del Mac para construir; el registro es donde los servidores la irán a buscar.
construir-imagen:
  stage: build
  image: docker:27-cli
  script:
    - echo "Construyendo $IMAGEN:$VERSION para el ambiente $AMBIENTE"
    - |
      docker build \
        --build-arg AMBIENTE="$AMBIENTE" \
        --build-arg VERSION="$VERSION" \
        --build-arg COMMIT="$CI_COMMIT_SHORT_SHA" \
        --build-arg RAMA="$CI_COMMIT_REF_NAME" \
        --build-arg PIPELINE="$CI_PIPELINE_IID" \
        -t "$IMAGEN:$VERSION" \
        -t "$IMAGEN:$AMBIENTE" \
        app/
    - docker push "$IMAGEN:$VERSION"
    - docker push "$IMAGEN:$AMBIENTE"
    - echo "Imagen publicada en el registro del taller"
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
      variables: { AMBIENTE: "dev" }
    - if: '$CI_COMMIT_BRANCH == "test"'
      variables: { AMBIENTE: "test" }
    - if: '$CI_COMMIT_BRANCH == "master"'
      variables: { AMBIENTE: "prod" }
    - if: '$CI_COMMIT_BRANCH == "main"'
      variables: { AMBIENTE: "prod" }

# ─────────────────────────────────────────────────────────── 4 · DEPLOY
.desplegar: &desplegar
  stage: deploy
  image: alpine:3.20
  before_script:
    - apk add --no-cache openssh-client >/dev/null
    # La llave llega como archivo pero con permisos que SSH rechaza.
    - install -m 600 "$SSH_PRIVADA" /tmp/llave
    - |
      cat > /tmp/ssh <<'EOF'
      #!/bin/sh
      exec ssh -i /tmp/llave -o StrictHostKeyChecking=no -o ConnectTimeout=10 "$@"
      EOF
      chmod +x /tmp/ssh
  script:
    - echo "Desplegando $IMAGEN:$VERSION en el servidor $AMBIENTE"
    # Todo lo que sigue ocurre DENTRO del servidor, en su propio Docker.
    - |
      /tmp/ssh "despliegue@amb-$AMBIENTE" "
        set -e
        echo '  bajando la imagen del registro…'
        docker pull $IMAGEN:$VERSION
        echo '  retirando la versión anterior…'
        docker rm -f aplicacion 2>/dev/null || true
        echo '  levantando la nueva…'
        docker run -d --name aplicacion --restart unless-stopped \
               -p 80:80 $IMAGEN:$VERSION
        echo '  corriendo en el servidor:'
        docker ps --filter name=aplicacion --format '    {{.Image}}  {{.Status}}'
      "
    - echo "Comprobando que responde…"
    - /tmp/ssh "despliegue@amb-$AMBIENTE" "curl -sf -o /dev/null -w '  HTTP %{http_code}\n' http://localhost/"
    - echo "Listo. Abra http://<IP-DEL-MAC>:$PUERTO"

desplegar-dev:
  <<: *desplegar
  variables: { AMBIENTE: "dev", PUERTO: "8081" }
  environment: { name: dev }
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'

desplegar-test:
  <<: *desplegar
  variables: { AMBIENTE: "test", PUERTO: "8082" }
  environment: { name: test }
  rules:
    - if: '$CI_COMMIT_BRANCH == "test"'

desplegar-prod:
  <<: *desplegar
  variables: { AMBIENTE: "prod", PUERTO: "8083" }
  environment: { name: prod }
  rules:
    # La promoción a producción NO es automática: alguien tiene que pulsar.
    # Es la diferencia entre entrega continua y despliegue continuo, y aquí
    # se ve como un botón en la interfaz de GitLab.
    - if: '$CI_COMMIT_BRANCH == "master"'
      when: manual
      allow_failure: false
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: false
