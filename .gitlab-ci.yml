# Pipeline del laboratorio.
#
# Las cuatro etapas son EXACTAMENTE las del Tema 8, diapositiva 23:
#   1. Unit Test          · verificar la lógica antes de gastar tiempo compilando
#   2. Análisis de código · calidad del código ya probado
#   3. Build del paquete  · recién aquí se arma el artefacto
#   4. Deploy al ambiente · sólo se instala lo que superó las tres anteriores
#
# Y las ramas son las del Tema 10, diapositiva 20:
#
#   rama dev    → despliega en el servidor DEV    (automático)
#   rama test   → despliega en el servidor TEST   (automático)
#   rama master → despliega en PROD               (MANUAL, con botón)
#
# El despliegue se hace copiando por SSH al servidor, que es como se
# despliega de verdad. Requiere la variable SSH_PRIVADA (tipo File), que
# imprime scripts/preparar-ambientes.sh

stages:
  - unit-test
  - analisis
  - build
  - deploy

variables:
  VERSION: "1.0.$CI_PIPELINE_IID"

default:
  tags:
    - taller

# ─────────────────────────────────────────────────────────── 1 · UNIT TEST
pruebas-unitarias:
  stage: unit-test
  image: alpine:3.20
  script:
    - echo "Comprobando la plantilla de la aplicación"
    - cd app && sh test.sh index.template.html

# ─────────────────────────────────────────────────────────── 2 · ANÁLISIS
analisis-de-codigo:
  stage: analisis
  image: alpine:3.20
  script:
    - echo "Buscando valores de ejemplo sin rellenar"
    - |
      if grep -rn "CAMBIAR-ESTO" app/ ambientes/ 2>/dev/null; then
        echo "Hay marcadores de ejemplo sin rellenar"; exit 1
      fi
    - echo "Comprobando que la plantilla no trae el ambiente escrito a mano"
    - |
      if grep -qE '>(dev|test|prod)<' app/index.template.html; then
        echo "La plantilla lleva un ambiente fijo; debe ponerlo el pipeline"; exit 1
      fi
    - echo "Análisis superado"

# ─────────────────────────────────────────────────────────── 3 · BUILD
# El artefacto es el HTML ya resuelto para su ambiente. Se guarda como
# artifact para que la etapa de deploy lo recoja: así se ve que build y
# deploy son dos pasos distintos y que el segundo no vuelve a construir.
construir:
  stage: build
  image: alpine:3.20
  script:
    - echo "Armando el paquete para $AMBIENTE  ·  version $VERSION"
    - |
      case "$AMBIENTE" in
        dev)  COLOR="#0f5f3d"; TEXTO="#eafff5" ;;
        test) COLOR="#8a5412"; TEXTO="#fff4e2" ;;
        prod) COLOR="#123a63"; TEXTO="#e6f1ff" ;;
      esac
      mkdir -p paquete
      sed -e "s|__AMBIENTE__|$AMBIENTE|g" \
          -e "s|__VERSION__|$VERSION|g" \
          -e "s|__COMMIT__|$CI_COMMIT_SHORT_SHA|g" \
          -e "s|__RAMA__|$CI_COMMIT_REF_NAME|g" \
          -e "s|__PIPELINE__|$CI_PIPELINE_IID|g" \
          -e "s|__FECHA__|$(date -u '+%Y-%m-%d %H:%M UTC')|g" \
          -e "s|__COLOR__|$COLOR|g" \
          -e "s|__TEXTO__|$TEXTO|g" \
          app/index.template.html > paquete/index.html
    - echo "Paquete listo"; head -3 paquete/index.html
  artifacts:
    paths: [paquete/]
    expire_in: 1 day
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
      variables: { AMBIENTE: "dev" }
    - if: '$CI_COMMIT_BRANCH == "test"'
      variables: { AMBIENTE: "test" }
    - if: '$CI_COMMIT_BRANCH == "master"'
      variables: { AMBIENTE: "prod" }
    - if: '$CI_COMMIT_BRANCH == "main"'
      variables: { AMBIENTE: "prod" }

# ─────────────────────────────────────────────────────────── 4 · DEPLOY
.desplegar: &desplegar
  stage: deploy
  image: alpine:3.20
  before_script:
    - apk add --no-cache openssh-client >/dev/null
    # La llave llega como archivo, pero con permisos que SSH rechaza.
    - install -m 600 "$SSH_PRIVADA" /tmp/llave
  script:
    - echo "Desplegando la version $VERSION en el servidor $AMBIENTE"
    # StrictHostKeyChecking=no porque los servidores se recrean en cada
    # taller y su huella cambia. En producción esto NO se hace.
    - |
      scp -i /tmp/llave -o StrictHostKeyChecking=no \
          paquete/index.html "despliegue@amb-$AMBIENTE:/var/www/html/index.html"
    - |
      ssh -i /tmp/llave -o StrictHostKeyChecking=no "despliegue@amb-$AMBIENTE" \
          "grep -o 'v[0-9.]*' /var/www/html/index.html | head -1"
    - echo "Desplegado. Abra http://<IP-DEL-MAC>:$PUERTO"

desplegar-dev:
  <<: *desplegar
  variables: { AMBIENTE: "dev", PUERTO: "8081" }
  environment: { name: dev }
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'

desplegar-test:
  <<: *desplegar
  variables: { AMBIENTE: "test", PUERTO: "8082" }
  environment: { name: test }
  rules:
    - if: '$CI_COMMIT_BRANCH == "test"'

desplegar-prod:
  <<: *desplegar
  variables: { AMBIENTE: "prod", PUERTO: "8083" }
  environment: { name: prod }
  rules:
    # La promoción a producción NO es automática: alguien tiene que pulsar.
    # Es la diferencia entre entrega continua y despliegue continuo, y aquí
    # se ve como un botón en la interfaz.
    - if: '$CI_COMMIT_BRANCH == "master"'
      when: manual
      allow_failure: false
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: false
